name: Dependabot release notes
description: Post the release notes of a Dependabot pull request as comments, past the description's size limit

inputs:
  token:
    description: Token that reads the pull request and writes its comments
    default: ${{ github.token }}
  pull-request:
    description: Pull request number to comment on
    default: ${{ github.event.pull_request.number }}
  author:
    description: Login that the token posts as, whose comments the action may edit and delete
    default: github-actions[bot]

runs:
  using: node24
  main: dependabot-release-notes.mjs

branding:
  icon: file-text
  color: blue
