name: Dependabot release notes
description: Post the release notes of a Dependabot pull request as comments, past the description's size limit

inputs:
  token:
    description: Token that reads the pull request and writes its comments
    default: ${{ github.token }}
  pull-request:
    description: Pull request number to comment on
    default: ${{ github.event.pull_request.number }}
  author:
    description: Login that the token posts as, whose comments the action may edit and delete
    default: github-actions[bot]

  any-author:
    description: Run on a pull request that Dependabot did not open, and read commits anyone pushed to one
    default: "false"
  only-when-truncated:
    description: Post only when Dependabot had to truncate the description, and take back earlier comments otherwise
    default: "false"

runs:
  using: node24
  main: dependabot-release-notes.mjs

branding:
  icon: file-text
  color: blue
